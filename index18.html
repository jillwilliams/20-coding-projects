<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Emoji Rating</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Gravitas One|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Quicksand" rel="stylesheet">
    <link rel="stylesheet" href="./styles18.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <h4>How did we do? Please give us a rating!</h4>
        <div class="emoji-container">
            <i class="fa-regular fa-face-angry fa-3x" id="angry"></i>
            <i class="fa-regular fa-face-frown fa-3x" id="frown"></i>
            <i class="fa-regular fa-face-meh fa-3x" id="meh"></i>
            <i class="fa-regular fa-face-smile fa-3x" id="smile"></i>
            <i class="fa-regular fa-face-laugh fa-3x" id="happy"></i>
        </div>
        <div class="stars" id="stars">
            <i class="fa-regular fa-star" id="star1"></i>
            <i class="fa-regular fa-star" id="star2"></i>
            <i class="fa-regular fa-star" id="star3"></i>
            <i class="fa-regular fa-star" id="star4"></i>
            <i class="fa-regular fa-star" id="star5"></i>
        </div>
        <div id="one-star">
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
        </div>
        <div id="two-stars">
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
        </div>
        <div id="three-stars">
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-regular fa-star" id="star"></i>
            <i class="fa-regular fa-star" id="star"></i>
        </div>
        <div id="four-stars">
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-regular fa-star" id="star"></i>
        </div>
        <div id="five-stars">
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
            <i class="fa-solid fa-star" id="filled-in"></i>
        </div>








    </div>
    
    <script src="app18.js"></script>
</body>
</html>
