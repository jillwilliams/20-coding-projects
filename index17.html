<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
    <title>Feedback UI</title>
    <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Gravitas One|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger|Quicksand" rel="stylesheet">
    <link rel="stylesheet" href="./styles17.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

    <!-- <meta name="keywords" content="”> -->
</head>
<body>
    <div class="container">
        <h1 class="heading">Give Us Your Feedback!</h1>
        <h3 class="heading2">How did we do today?</h3>
        <div class="icon-section">
            <i class="fa-regular fa-face-frown" id="frowny">
                <label for="frowny" id="unhappy">Unhappy</label>
            </i>
            <i class="fa-regular fa-face-meh" id="neutral">
                <label for="neutral" id="meh">Neutral</label>
            </i>
            <i class="fa-regular fa-face-smile" id="happy">
                <label for="happy" id="ok">Satisfied</label>
            </i>
        </div>
        <button id="openBtn">SEND REVIEW</button>
        <dialog id="popupBox">
            <div class="response" id="response">This is a box</div>
            <button id="closeBtn">X</button>
        </dialog>
        
    </div>

    <script src="app17.js"></script>
</body>
</html>
